# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "**.go"
      - "Makefile"
      - "go.**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "**.go"
      - "Makefile"
      - "go.**"
  merge_group:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build
        run: make build

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

      - name: Test
        run: make test

      - name: Zola build Test
        env:
          GH_TOKEN: ${{ github.token }}
          ZOLA_VERSION: v0.23.3
        run: |
          gh release download $ZOLA_VERSION --repo getzola/zola -p '*x86_64-unknown-linux-gnu*' -O- | tar -xz -C /tmp && mv /tmp/zola /usr/local/bin
          ./bin/isite generate --engine zola --repo withcode --user kemingy --label "python"
          (cd output && zola build)
          rm -rf output

      - name: Astro build test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./bin/isite generate --engine astro --repo withcode --user kemingy --label "python"
          npm install --prefix output
          npm run build --prefix output
          rm -rf output
